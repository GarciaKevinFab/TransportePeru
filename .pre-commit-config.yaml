# Pre-commit hooks para TransportePeru
# Instalación:
#   pip install pre-commit
#   pre-commit install
# Ejecutar manualmente sobre todo el repo:
#   pre-commit run --all-files

repos:
  # ---- Backend: Ruff (lint + format) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint backend)
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format backend)
        files: ^backend/.*\.py$

  # ---- Frontend: Prettier (solo frontend/src) ----
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: prettier (format frontend/src)
        files: ^frontend/src/.*\.(js|jsx|ts|tsx|css|json)$
