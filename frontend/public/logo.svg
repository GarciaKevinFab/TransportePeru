<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CargoXprez">
  <title>CargoXprez</title>
  <!-- El icono es un CAMION, que es lo que hace el producto y lo que preside
       el logotipo. Antes era la X sola: a 16 px se leia como una equis de
       cerrar, que en una barra de pestanas es justo el gesto contrario.

       La silueta esta dibujada para el tamano MAS PEQUENO, no para el mas
       grande: tractor, caja y dos ruedas, y nada mas. Lo que a 512 px seria
       detalle -espejos, parrilla, manijas- a 16 px es una mancha gris.

       Fondo rojo de la marca y camion en blanco. Es el par de mas contraste de
       los tres colores del logotipo y, sobre todo, se ve igual de bien en una
       barra de pestanas clara que en una oscura; un icono oscuro sobre tema
       oscuro desaparece.

       Los huecos -parabrisas y llantas- estan restados EN EL COLOR DEL FONDO,
       no en negro: asi el icono son dos tintas planas, que es lo unico que
       sobrevive al reescalado a 16 px. -->
  <rect width="512" height="512" rx="112" fill="#e00000"/>
  <g transform="translate(256.0 256.0) scale(1) translate(-230.5 -281.0)">
  <g stroke="#ffffff" stroke-linecap="round" stroke-width="17">
    <line x1="26" y1="214" x2="70" y2="214" opacity=".85"/>
    <line x1="26" y1="262" x2="58" y2="262" opacity=".6"/>
    <line x1="26" y1="310" x2="46" y2="310" opacity=".38"/>
  </g>
  <g fill="#ffffff">
    <rect x="92" y="168" width="196" height="146" rx="14"/>
    <path d="M310 168h74a16 16 0 0 1 13 7l38 56a16 16 0 0 1 3 9v58a16 16 0 0 1-16 16H310a16 16 0 0 1-16-16V184a16 16 0 0 1 16-16z"/>
    <circle cx="168" cy="342" r="52"/>
    <circle cx="392" cy="342" r="52"/>
  </g>
  <g fill="#e00000">
    <path d="M392 190h-24a10 10 0 0 0-10 10v34h58z"/>
    <circle cx="168" cy="342" r="21"/>
    <circle cx="392" cy="342" r="21"/>
  </g>
  </g>
</svg>
