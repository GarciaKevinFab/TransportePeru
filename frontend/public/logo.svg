<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="CargoXprez">
  <title>CargoXprez</title>
  <!-- La X del logotipo, la parte que sigue siendo legible cuando el icono
       mide 32 px. Va inclinada -8 grados como en la marca, que esta dibujada
       "en movimiento", y las estelas llevan el rojo (#e00000) para que no se
       lea como una equis de cerrar. -->
  <rect width="512" height="512" rx="112" fill="#0a0a0c"/>
  <g transform="rotate(-8 256 256)">
    <g stroke="#f5f5f7" stroke-width="59" stroke-linecap="butt">
      <line x1="143" y1="143" x2="369" y2="369"/>
      <line x1="369" y1="143" x2="143" y2="369"/>
    </g>
    <g stroke="#e00000" stroke-width="11" stroke-linecap="round">
      <line x1="26" y1="169" x2="113" y2="169"/>
      <line x1="26" y1="256" x2="95"  y2="256"/>
      <line x1="26" y1="343" x2="77"  y2="343"/>
    </g>
  </g>
</svg>
