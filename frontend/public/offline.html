<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión - TransportePeru</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      background: #e00000;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #c00000;
    }
    .pending-count {
      margin-top: 2rem;
      padding: 1rem;
      background: rgba(249, 115, 22, 0.1);
      border-radius: 8px;
      border: 1px solid rgba(249, 115, 22, 0.3);
    }
    .pending-count h3 {
      font-size: 0.875rem;
      color: #e00000;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M1 1l22 22M9 9a3 3 0 014.24 4.24M7.5 7.5A8 8 0 0116.5 16.5M4.5 4.5A12 12 0 0119.5 19.5"/>
    </svg>
    <h1>Sin Conexión</h1>
    <p>No tienes conexión a internet. Los datos pendientes se sincronizarán automáticamente cuando vuelvas a conectarte.</p>
    <button class="btn" onclick="location.reload()">Reintentar</button>
    
    <div class="pending-count" id="pending-info" style="display: none;">
      <h3>Datos Pendientes por Sincronizar</h3>
      <p id="pending-text">Cargando...</p>
    </div>
  </div>
  
  <script>
    // Check for pending offline data
    async function checkPendingData() {
      try {
        const request = indexedDB.open('TransperuOffline', 1);
        request.onsuccess = () => {
          const db = request.result;
          if (db.objectStoreNames.contains('pending_checklists')) {
            const tx = db.transaction(['pending_checklists', 'pending_expenses'], 'readonly');
            const checklistStore = tx.objectStore('pending_checklists');
            const expenseStore = tx.objectStore('pending_expenses');
            
            Promise.all([
              new Promise(r => { const req = checklistStore.count(); req.onsuccess = () => r(req.result); }),
              new Promise(r => { const req = expenseStore.count(); req.onsuccess = () => r(req.result); }),
            ]).then(([checklists, expenses]) => {
              if (checklists > 0 || expenses > 0) {
                document.getElementById('pending-info').style.display = 'block';
                document.getElementById('pending-text').textContent = 
                  `${checklists} checklist(s) y ${expenses} gasto(s) pendientes`;
              }
            });
          }
        };
      } catch (e) {
        console.error(e);
      }
    }
    checkPendingData();
  </script>
</body>
</html>
