    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>G&E Transporta S.A.C | Gestion de Flota</title>
    <script>
        window.addEventListener(
            "error",
            function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            },
            true
        );
    </script>
    <style>
        @keyframes badge-dot-pulse {

            0%,
            100% {
                box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.20);
            }

            50% {
                box-shadow: 0 0 0 5px rgba(74, 222, 128, 0.07);
            }
        }

        #brand-badge-dot {
            animation: badge-dot-pulse 2.4s ease-in-out infinite;
        }

    <style>
        @keyframes brand-pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(74,222,128,0.45); }
            50%    { box-shadow: 0 0 0 6px rgba(74,222,128,0); }

            100% { transform: translateX(250%) skewX(-20deg); }
        }
        @keyframes brand-float-in {
            from { opacity: 0; transform: translateY(20px) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        #brand-badge {
            position: fixed;
            bottom: 18px;
            right: 18px;
            z-index: 9999;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px 6px 6px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(15,23,42,0.92) 0%, rgba(30,41,59,0.88) 100%);
            border: 1px solid rgba(255,255,255,0.10);
            box-shadow:
                0 10px 30px rgba(0,0,0,0.35),
                0 2px 8px rgba(0,0,0,0.2),
                inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            text-decoration: none;
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease;
            transform-style: preserve-3d;
            perspective: 800px;
            overflow: hidden;
            animation: brand-float-in 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #brand-badge::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transform: translateX(-150%) skewX(-20deg);
            pointer-events: none;
        }
        #brand-badge:hover {
            transform: translateY(-4px) scale(1.03) rotateX(-2deg);
            box-shadow:
                0 20px 50px rgba(0,0,0,0.5),
                0 4px 14px rgba(249,115,22,0.18),
                inset 0 1px 0 rgba(255,255,255,0.14);
        }
        #brand-badge:hover::before {
            animation: brand-shine 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #brand-badge:active { transform: translateY(-1px) scale(0.99); }
        #brand-badge-logo {
            position: relative;
            width: 38px; height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow:
                0 4px 12px rgba(249,115,22,0.4),
                inset 0 1px 0 rgba(255,255,255,0.25),
                inset 0 -1px 0 rgba(0,0,0,0.15);
            flex-shrink: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #brand-badge:hover #brand-badge-logo {
            transform: rotateY(360deg) scale(1.05);
        }
        #brand-badge-logo img {
            width: 30px; height: 30px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25));
        }
        #brand-badge-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.2px;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand-badge-sub {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-top: 2px;
            line-height: 1;
        }
        #brand-badge-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 0 0 rgba(74,222,128,0.45);
            flex-shrink: 0;
            animation: brand-pulse 1.8s ease-in-out infinite;
            margin-left: 2px;
        }
        @media (max-width: 480px) {
            #brand-badge { bottom: 12px; right: 12px; padding: 5px 11px 5px 5px; gap: 8px; }
            #brand-badge-logo { width: 32px; height: 32px; border-radius: 9px; }
            #brand-badge-logo img { width: 24px; height: 24px; }
            #brand-badge-title { font-size: 12px; }
            #brand-badge-sub { font-size: 9px; }
        }
    </style>
    <a id="brand-badge" href="https://sisac.pe/" target="_blank" rel="noreferrer">
        <span id="brand-badge-logo">
            <img src="%PUBLIC_URL%/logo.png" alt="Star Insights IT" />
        </span>
        <span style="display: flex; flex-direction: column; line-height: 1;">
            <span id="brand-badge-title">G&amp;E Transporta</span>
            <span id="brand-badge-sub">by Star Insights IT</span>
        </span>
        <span id="brand-badge-dot"></span>
    </a>
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
